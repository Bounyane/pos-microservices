location /api/order/asyncOrder{
    access_by_lua_block {
    local auth = require "auth"
    auth.validate_auth({'MANAGER','ADMIN'})
    }
    proxy_pass http://order-service$request_uri;
    include  /usr/local/openresty/nginx/conf/proxy_header/proxy_headers.conf;
    #access_log /usr/local/openresty/nginx/logs/access.log detailed;
}

location /api/order/updateOrder{
    access_by_lua_block {
    local auth = require "auth"
    auth.validate_auth({'MANAGER','ADMIN'})
    }
    proxy_pass http://order-service$request_uri;
    include  /usr/local/openresty/nginx/conf/proxy_header/proxy_headers.conf;
    #access_log /usr/local/openresty/nginx/logs/access.log detailed;
}